name: Prepare KDWB audio

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install audio converter
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
      - name: Prepare office ambience source
        run: |
          curl -fsSL --retry 3 'https://cdn.freesound.org/previews/534/534123_7724198-hq.mp3' -o /tmp/kdwb-office.mp3
          ffmpeg -hide_banner -loglevel error -y -i /tmp/kdwb-office.mp3 -ac 1 -ar 44100 -c:a pcm_s16le kdwb-office-studio-loop-v1.wav
      - name: Balance ambience and create soundboard
        run: |
          python3 <<'PY'
          import array, math, random, wave

          RATE = 44100
          random.seed(20261126)

          def load_wav(path):
              with wave.open(path, "rb") as source:
                  params = source.getparams()
                  if params.sampwidth != 2 or params.nchannels != 1:
                      raise RuntimeError(f"{path}: expected mono 16-bit PCM")
                  return params, array.array("h", source.readframes(params.nframes))

          def write_wav(path, values, target_rms_db=-24.0, peak_cap_db=-6.0):
              peak = max(abs(x) for x in values) or 1.0
              rms = math.sqrt(sum(x*x for x in values) / len(values)) or 1.0
              target_rms = 10 ** (target_rms_db / 20)
              peak_cap = 10 ** (peak_cap_db / 20)
              gain = min(target_rms / rms, peak_cap / peak)
              samples = array.array("h", (max(-32768, min(32767, round(x * gain * 32767))) for x in values))
              with wave.open(path, "wb") as output:
                  output.setnchannels(1)
                  output.setsampwidth(2)
                  output.setframerate(RATE)
                  output.writeframes(samples.tobytes())
              final_rms = math.sqrt(sum(x*x for x in samples) / len(samples))
              final_peak = max(abs(x) for x in samples)
              print(f"{path}: rms={20*math.log10(final_rms/32768):.1f} dBFS peak={20*math.log10(final_peak/32768):.1f} dBFS")

          def balance_existing(path, target_rms_db=-42.0, peak_cap_db=-6.0):
              _, samples = load_wav(path)
              write_wav(path, [sample / 32768 for sample in samples], target_rms_db, peak_cap_db)

          def add_echo(values, delay_s, gain):
              delay = int(delay_s * RATE)
              original = values[:]
              for i in range(delay, len(values)):
                  values[i] += original[i-delay] * gain

          def stadium_horn():
              duration = 2.4
              out = [0.0] * int(duration * RATE)
              for i in range(len(out)):
                  t = i / RATE
                  attack = min(1.0, t / 0.035)
                  release = min(1.0, (duration - t) / 0.35)
                  env = attack * max(0.0, release)
                  pitch = 233.1 * (1 + 0.006 * math.sin(2*math.pi*5.2*t))
                  phase = 2 * math.pi * pitch * t
                  tone = sum(math.sin(h*phase + 0.11*h) / (h ** 1.15) for h in range(1, 9))
                  out[i] = env * (0.24 * tone + 0.018 * random.uniform(-1, 1))
              add_echo(out, 0.19, 0.24)
              add_echo(out, 0.38, 0.12)
              return out

          def karplus_note(freq, duration, decay=0.995):
              count = int(duration * RATE)
              period = max(2, round(RATE / freq))
              ring = [random.uniform(-1, 1) for _ in range(period)]
              out = [0.0] * count
              index = 0
              previous = 0.0
              for i in range(count):
                  current = ring[index]
                  averaged = decay * 0.5 * (current + previous)
                  ring[index] = averaged
                  previous = current
                  index = (index + 1) % period
                  out[i] = math.tanh(current * 1.7) * math.exp(-1.7 * i / count)
              return out

          def guitar_sting():
              duration = 2.8
              out = [0.0] * int(duration * RATE)
              for start, freq in [(0.0, 329.63), (0.63, 261.63), (1.26, 196.00)]:
                  note = karplus_note(freq, 1.45, 0.996)
                  offset = int(start * RATE)
                  for i, sample in enumerate(note):
                      if offset + i < len(out):
                          out[offset+i] += sample * 0.44
              add_echo(out, 0.14, 0.18)
              return out

          def toilet_flush():
              duration = 4.0
              out = [0.0] * int(duration * RATE)
              low = 0.0
              for i in range(len(out)):
                  t = i / RATE
                  if t < 0.25:
                      env = t / 0.25
                  elif t < 2.7:
                      env = 1.0
                  else:
                      env = max(0.0, (duration - t) / 1.3)
                  noise = random.uniform(-1, 1)
                  low = low * 0.86 + noise * 0.14
                  swirl = math.sin(2*math.pi*(85 + 28*math.sin(2*math.pi*0.7*t))*t)
                  gurgle = max(0.0, math.sin(2*math.pi*(3.2 + 0.4*math.sin(t))*t)) ** 9
                  out[i] = env * (0.34*low + 0.06*swirl + 0.16*gurgle*math.sin(2*math.pi*118*t))
              return out

          def drum_roll():
              duration = 3.0
              out = [0.0] * int(duration * RATE)
              hit = 0.0
              next_hit = 0.0
              t = 0.0
              while t < 2.28:
                  progress = t / 2.28
                  spacing = 0.105 - 0.067 * progress
                  start = int(t * RATE)
                  length = int(0.055 * RATE)
                  for j in range(length):
                      env = math.exp(-55 * j / RATE)
                      out[start+j] += random.uniform(-1, 1) * env * (0.15 + 0.18*progress)
                  t += spacing
              crash = int(2.28 * RATE)
              filtered = 0.0
              for j in range(len(out)-crash):
                  noise = random.uniform(-1, 1)
                  filtered = 0.3*filtered + 0.7*noise
                  env = math.exp(-2.6*j/RATE)
                  out[crash+j] += filtered * env * 0.42
              return out

          def applause():
              duration = 3.2
              out = [0.0] * int(duration * RATE)
              for _ in range(125):
                  t = random.uniform(0.02, 2.75)
                  start = int(t * RATE)
                  length = random.randint(120, 310)
                  strength = random.uniform(0.09, 0.28) * (0.65 + 0.35*math.sin(math.pi*t/duration))
                  for j in range(length):
                      env = math.exp(-7*j/length)
                      sample = random.uniform(-1, 1) * env * strength
                      if start+j < len(out): out[start+j] += sample
                      echo = start+j+int(random.uniform(0.025, 0.07)*RATE)
                      if echo < len(out): out[echo] += sample*0.22
              return out

          def buzzer():
              duration = 1.55
              out = [0.0] * int(duration * RATE)
              for i in range(len(out)):
                  t = i / RATE
                  env = min(1.0, t/0.012) * min(1.0, (duration-t)/0.06)
                  square = 1.0 if math.sin(2*math.pi*176*t) >= 0 else -1.0
                  buzz = 0.58*square + 0.22*math.sin(2*math.pi*352*t) + 0.1*math.sin(2*math.pi*528*t)
                  out[i] = env * buzz * (0.86 + 0.14*math.sin(2*math.pi*28*t))
              return out

          balance_existing("kdwb-office-studio-loop-v1.wav")
          write_wav("kdwb-sfx-stadium-horn-v1.wav", stadium_horn())
          write_wav("kdwb-sfx-guitar-sting-v1.wav", guitar_sting())
          write_wav("kdwb-sfx-toilet-flush-v1.wav", toilet_flush())
          write_wav("kdwb-sfx-drum-roll-v1.wav", drum_roll())
          write_wav("kdwb-sfx-applause-v1.wav", applause())
          write_wav("kdwb-sfx-buzzer-v1.wav", buzzer())
          PY
      - name: Record sources and commit
        run: |
          cat > KDWB-AUDIO-SOURCES.md <<'EOF'
          # KDWB audio sources

          - `kdwb-office-studio-loop-v1.wav` is derived from **Busy Office No People Loop** by Fupicat on Freesound (CC0 1.0): https://freesound.org/people/Fupicat/sounds/534123/
          - The six `kdwb-sfx-*` files were generated specifically for this project and are released as CC0 1.0.

          All files are mono 44.1 kHz, 16-bit WAV and volume-balanced for phone playback.
          EOF
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add kdwb-*.wav KDWB-AUDIO-SOURCES.md
          git commit --trailer "Co-authored-by: Cursor <cursoragent@cursor.com>" -m "Add balanced KDWB studio ambience and soundboard effects"
          git push
